name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # so the action can comment on PRs with findings

jobs:
  dependency-review:
    name: Vulnerable / restricted-license dep scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # `on-failure` keeps the action from trying to post a comment
          # under Dependabot's read-only token, which would error. We
          # still fail the check; the comment only lands when there's a
          # finding worth surfacing.
          comment-summary-in-pr: on-failure
          # Block deps under licenses we don't want in a public MIT repo.
          # Add to allow-list as concrete needs arise.
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0
