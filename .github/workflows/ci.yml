name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest
        env:
          # Tests must not hit the network — recorded cassettes only.
          GEMINI_API_KEY: "test-dummy"
          ANTHROPIC_API_KEY: "sk-ant-test-dummy"

      - name: Upload coverage.xml (py3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 1

  sonarcloud:
    name: SonarCloud
    needs: quality
    runs-on: ubuntu-latest
    # GitHub withholds repo secrets from fork PRs and from Dependabot-
    # authored PRs (security-by-default). SONAR_TOKEN would be empty in
    # both, so skip the scan rather than fail. Sonar still runs on
    # direct pushes to main and on PRs from the same repo by a human.
    if: >
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.fork == false &&
       github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar wants full history for better blame / new-code detection.
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
