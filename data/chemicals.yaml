# Brand → active-ingredient bridge.
#
# Extension publications (Clemson HGIC, NCSU TurfFiles, UGA Extension,
# UF IFAS) discuss turf chemicals by active ingredient, not by retail
# brand. The synthesizer reads passages from those sources; users ask
# questions using brand names ("GrubX", "Celsius", "Sedgehammer"). Without
# a bridge, the synthesizer refuses on the brand even when the corpus
# fully covers the chemistry.
#
# This file is the bridge. When a brand here appears in a user's
# question, the orchestrator injects the corresponding active
# ingredient(s) into the synthesizer prompt so passages discussing that
# chemistry are treated as supporting evidence for the brand.
#
# Schema:
#   brands:
#     "<Brand Name>":
#       active_ingredients: ["<chemical>", ...]
#       category: <fertilizer|micronutrient|herbicide|insecticide|fungicide>
#       notes: "<optional short note>"
#
# Seed list is focused on warm-season Southeast US turf. Add as new
# products enter your program.

brands:
  # --- Insecticides (white grubs + turf caterpillars) ---
  "GrubX":
    active_ingredients: ["chlorantraniliprole"]
    category: insecticide
    notes: "Scotts consumer brand; same chemistry as Acelepryn."

  "Acelepryn":
    active_ingredients: ["chlorantraniliprole"]
    category: insecticide
    notes: "Syngenta professional product; preventive white-grub and turf-caterpillar control."

  "Merit":
    active_ingredients: ["imidacloprid"]
    category: insecticide
    notes: "Bayer / Envu; preventive grub control; older neonicotinoid chemistry."

  "Dylox":
    active_ingredients: ["trichlorfon"]
    category: insecticide
    notes: "Bayer / Envu; curative grub control once damage is visible."

  # --- Post-emergent herbicides ---
  "Celsius":
    active_ingredients:
      - "thiencarbazone-methyl"
      - "iodosulfuron-methyl-sodium"
      - "dicamba"
    category: herbicide
    notes: "Bayer / Envu; selective broadleaf + grassy-weed control for warm-season turf; tolerates summer heat."

  "Sedgehammer":
    active_ingredients: ["halosulfuron-methyl"]
    category: herbicide
    notes: "Gowan; selective post-emergent for yellow + purple nutsedge and green kyllinga. Translocated (systemic) — moves to nutlets/tubers and kills the underground reproductive structures. Slower visible effect (2-3 weeks) but durable kill. Apply on actively growing sedges; surfactant required (Sedgehammer+ ships with surfactant included, plain Sedgehammer requires non-ionic surfactant added separately). Safe on Zoysia, Bermuda, St. Augustine, Centipede. Often paired with sulfentrazone (Sedge Ender) sequentially: sulfentrazone for fast above-ground knockdown, halosulfuron-methyl for nutlet kill via translocation. Use different modes of action for resistance management (halosulfuron is ALS / Group 2; sulfentrazone is PPO / Group 14)."

  "Sedge Ender":
    active_ingredients: ["sulfentrazone"]
    category: herbicide
    notes: "Bonide consumer brand; PPO-inhibitor post-emergent (Group 14 — different mode of action from Sedgehammer's ALS-inhibitor halosulfuron-methyl). Contact / above-ground burndown action: fast visible damage (days), full kill 2-3 weeks. Controls nutsedge plus a broader set of broadleaf weeds (dollarweed, spurge, oxalis). Common residential SKU. Often paired with halosulfuron-methyl (Sedgehammer) sequentially for tough nutsedge infestations — sulfentrazone burns the foliage quickly while halosulfuron translocates to kill nutlets. Apply on actively growing sedge to dry foliage during warm weather. Safe on most warm-season turf including Zoysia at labeled rates."

  "Fusilade II":
    active_ingredients: ["fluazifop-P-butyl"]
    category: herbicide
    notes: "Syngenta; EPA Reg. 100-1084. 24.5% fluazifop-P-butyl (2 lb ai/gal). ACCase inhibitor (Group 1) — selective systemic graminicide, moves into shoots, roots, rhizomes and stolons of grass weeds. On Zoysia the label covers suppression/control of common and hybrid bermudagrass and other grass weeds at 3-6 oz/A (0.07-0.14 oz per 1000 sqft) with 0.25% v/v non-ionic surfactant, every 28 days; over-spray Zoysia use is 3-4 oz/A starting around June 1. Label says to apply in spring and fall and AVOID July-August, and not to apply to turf under stress. IMPORTANT SITE RESTRICTION: the desirable-turfgrass section states 'Not for use on home lawns' and the label elsewhere states 'NO APPLICATIONS SHALL BE MADE IN OR AROUND HOMES' — check this against your site before recommending. Rate in the Recognition tank mix is far higher (16-24 oz/A on Zoysia) than the standalone Zoysia rate; see the Recognition entry."

  "Recognition":
    active_ingredients: ["trifloxysulfuron-sodium"]
    category: herbicide
    notes: "Syngenta; EPA Reg. 100-1658; alternate brand name Monument II. 20.4% trifloxysulfuron-sodium (0.204 lb ai/lb), water-dispersible granule. ALS inhibitor (Group 2) — same mode-of-action group as Sedgehammer's halosulfuron-methyl, so alternate chemistries for resistance management. Labeled post-emergent for established bermudagrass, zoysiagrass, buffalograss, St. Augustinegrass and kikuyugrass including residential lawns (except California). Controls listed broadleaf, sedge and grass weeds — Weed Group A includes yellow nutsedge, green kyllinga and globe sedge; Group B (suppression only) includes purple nutsedge, dallisgrass, bahiagrass and torpedograss. USE LIMITS: max 6.26 oz/A/year, max 1.95 oz/A per application, no more than 3 applications per year at the highest rate, and at least 28 days between retreatments. Tank mix with fluazifop-P-butyl (Fusilade II) is labeled for St. Augustinegrass and zoysiagrass to control bermudagrass and goosegrass — Zoysia rate is Recognition 1.95 oz/A (0.045 oz per 1000 sqft) plus Fusilade II 16-24 oz/A (0.37-0.55 oz per 1000 sqft), with 0.25-0.5% v/v non-ionic surfactant. Label warns: do NOT use the Recognition + Fusilade II mix for crabgrass (herbicide antagonism), and do NOT apply Recognition + triclopyr to zoysiagrass (unacceptable injury may occur) — the triclopyr mix for doveweed is St. Augustine only. The label contains no safener language; marketing copy referencing a metcamifen safener is not label-supported."

  "Monument II":
    active_ingredients: ["trifloxysulfuron-sodium"]
    category: herbicide
    notes: "Syngenta; alternate brand name for Recognition (EPA Reg. 100-1658) — same 20.4% trifloxysulfuron-sodium formulation. See the Recognition entry for rates, use limits and tank-mix restrictions."

  # --- Pre-emergent herbicides ---
  "Prodiamine":
    active_ingredients: ["prodiamine"]
    category: herbicide
    notes: "Active-ingredient name; sold as Barricade. Long-residual spring/fall pre-emergent."

  "Dithiopyr":
    active_ingredients: ["dithiopyr"]
    category: herbicide
    notes: "Sold as Dimension. Provides crabgrass post-emergent control through tillering."

  # --- Fungicides ---
  "Heritage":
    active_ingredients: ["azoxystrobin"]
    category: fungicide
    notes: "Syngenta; broad-spectrum strobilurin for large patch and other warm-season diseases."

  "3336":
    active_ingredients: ["thiophanate-methyl"]
    category: fungicide
    notes: "Cleary's 3336; systemic fungicide for brown / large patch."

  # --- Fertilizers (slow-release / organic / synthetic) ---
  #
  # `active_ingredients` here lists the primary nutrients delivered (N, P, K,
  # iron, etc.) so the synthesizer recognizes the product as a fertilizer of
  # the right NPK family. The release type + burn-risk profile lives in
  # `notes` — this is the property that matters most for drought / stress
  # decisions, and it's the gap that caused the synthesizer to be overly
  # cautious about Milorganite during D3 drought (PR-comments 2026-06-09).
  "Milorganite":
    active_ingredients: ["nitrogen", "phosphorus", "iron"]
    category: fertilizer
    notes: "6-4-0 plus iron; slow-release biosolids from Milwaukee MMSD. Very low salt index — burn risk is minimal even on stressed / drought-affected turf. Reformulated from 5-3-0 around 2024; older references may list the previous NPK."

  "Sta-Green 16-0-10":
    active_ingredients: ["nitrogen", "potassium"]
    category: fertilizer
    notes: "16-0-10 slow-release synthetic (Lowe's brand). Slow N release keeps soluble salt concentration low, lower burn risk than fast-release urea but higher than organic biosolids. 20 lb bag covers ~4,000 sqft at the label rate."

  "Scotts Turf Builder":
    active_ingredients: ["nitrogen", "phosphorus", "potassium"]
    category: fertilizer
    notes: "Scotts consumer brand; NPK varies by SKU (commonly 32-0-4, 28-0-3). Typically partially slow-release urea + AS blends. Moderate burn risk on stressed turf — read the specific SKU label."

  "Ironite":
    active_ingredients: ["iron", "nitrogen"]
    category: fertilizer
    notes: "Iron supplement for green-up; mineral product (1-0-1 plus iron). Low N content means low burn risk. Often paired with a real fertilizer rather than used alone."
