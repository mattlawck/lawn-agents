# Brand → active-ingredient bridge.
#
# Extension publications (Clemson HGIC, NCSU TurfFiles, UGA Extension,
# UF IFAS) discuss turf chemicals by active ingredient, not by retail
# brand. The synthesizer reads passages from those sources; users ask
# questions using brand names ("GrubX", "Celsius", "Sedgehammer"). Without
# a bridge, the synthesizer refuses on the brand even when the corpus
# fully covers the chemistry.
#
# This file is the bridge. When a brand here appears in a user's
# question, the orchestrator injects the corresponding active
# ingredient(s) into the synthesizer prompt so passages discussing that
# chemistry are treated as supporting evidence for the brand.
#
# Schema:
#   brands:
#     "<Brand Name>":
#       active_ingredients: ["<chemical>", ...]
#       category: <fertilizer|micronutrient|herbicide|insecticide|fungicide>
#       notes: "<optional short note>"
#
# Seed list is focused on warm-season Southeast US turf. Add as new
# products enter your program.

brands:
  # --- Insecticides (white grubs + turf caterpillars) ---
  "GrubX":
    active_ingredients: ["chlorantraniliprole"]
    category: insecticide
    notes: "Scotts consumer brand; same chemistry as Acelepryn."

  "Acelepryn":
    active_ingredients: ["chlorantraniliprole"]
    category: insecticide
    notes: "Syngenta professional product; preventive white-grub and turf-caterpillar control."

  "Merit":
    active_ingredients: ["imidacloprid"]
    category: insecticide
    notes: "Bayer / Envu; preventive grub control; older neonicotinoid chemistry."

  "Dominion":
    active_ingredients: ["imidacloprid"]
    category: insecticide
    notes: "Control Solutions 'Dominion 2L'; 21.4% imidacloprid (2 lb/gal). Same chemistry as Merit — a neonicotinoid, Group 4A. Preventive white-grub control applied ahead of egg hatch; weak curatively on large grubs. Also labelled as a termiticide, which is why bottle sizes and rates vary widely by use site — read the turf section, not the perimeter section."

  "Talstar P":
    active_ingredients: ["bifenthrin"]
    category: insecticide
    notes: "FMC; 7.9% bifenthrin. Pyrethroid (Group 3A), broad-spectrum CONTACT insecticide. Targets surface-active pests — chinch bugs, armyworms, sod webworms, mole cricket nymphs, fire ants, perimeter pests. Binds tightly to soil and thatch so it does NOT move down to the root zone: it is not a white-grub product, which is a common and expensive mix-up with the preventive grub chemistries. Highly toxic to pollinators and aquatic life; keep off blooming plants and away from drains."

  "Dylox":
    active_ingredients: ["trichlorfon"]
    category: insecticide
    notes: "Bayer / Envu; curative grub control once damage is visible."

  # --- Post-emergent herbicides ---
  "Celsius":
    active_ingredients:
      - "thiencarbazone-methyl"
      - "iodosulfuron-methyl-sodium"
      - "dicamba"
    category: herbicide
    notes: "Bayer / Envu; selective broadleaf + grassy-weed control for warm-season turf; tolerates summer heat."

  "Sedgehammer":
    active_ingredients: ["halosulfuron-methyl"]
    category: herbicide
    notes: "Gowan; selective post-emergent for yellow + purple nutsedge and green kyllinga. Translocated (systemic) — moves to nutlets/tubers and kills the underground reproductive structures. Slower visible effect (2-3 weeks) but durable kill. Apply on actively growing sedges; surfactant required (Sedgehammer+ ships with surfactant included, plain Sedgehammer requires non-ionic surfactant added separately). Safe on Zoysia, Bermuda, St. Augustine, Centipede. Often paired with sulfentrazone (Sedge Ender) sequentially: sulfentrazone for fast above-ground knockdown, halosulfuron-methyl for nutlet kill via translocation. Use different modes of action for resistance management (halosulfuron is ALS / Group 2; sulfentrazone is PPO / Group 14)."

  "Sedge Ender":
    active_ingredients: ["sulfentrazone"]
    category: herbicide
    notes: "Bonide consumer brand; PPO-inhibitor post-emergent (Group 14 — different mode of action from Sedgehammer's ALS-inhibitor halosulfuron-methyl). Contact / above-ground burndown action: fast visible damage (days), full kill 2-3 weeks. Controls nutsedge plus a broader set of broadleaf weeds (dollarweed, spurge, oxalis). Common residential SKU. Often paired with halosulfuron-methyl (Sedgehammer) sequentially for tough nutsedge infestations — sulfentrazone burns the foliage quickly while halosulfuron translocates to kill nutlets. Apply on actively growing sedge to dry foliage during warm weather. Safe on most warm-season turf including Zoysia at labeled rates."

  "Fusilade II":
    active_ingredients: ["fluazifop-P-butyl"]
    category: herbicide
    notes: "Syngenta; EPA Reg. 100-1084. 24.5% fluazifop-P-butyl (2 lb ai/gal). ACCase inhibitor (Group 1) — selective systemic graminicide, moves into shoots, roots, rhizomes and stolons of grass weeds. On Zoysia the label covers suppression/control of common and hybrid bermudagrass and other grass weeds at 3-6 oz/A (0.07-0.14 oz per 1000 sqft) with 0.25% v/v non-ionic surfactant, every 28 days; over-spray Zoysia use is 3-4 oz/A starting around June 1. Label says to apply in spring and fall and AVOID July-August, and not to apply to turf under stress. IMPORTANT SITE RESTRICTION: the desirable-turfgrass section states 'Not for use on home lawns' and the label elsewhere states 'NO APPLICATIONS SHALL BE MADE IN OR AROUND HOMES' — check this against your site before recommending. Rate in the Recognition tank mix is far higher (16-24 oz/A on Zoysia) than the standalone Zoysia rate; see the Recognition entry."

  "Recognition":
    active_ingredients: ["trifloxysulfuron-sodium"]
    category: herbicide
    notes: "Syngenta; EPA Reg. 100-1658; alternate brand name Monument II. 20.4% trifloxysulfuron-sodium (0.204 lb ai/lb), water-dispersible granule. ALS inhibitor (Group 2) — same mode-of-action group as Sedgehammer's halosulfuron-methyl, so alternate chemistries for resistance management. Labeled post-emergent for established bermudagrass, zoysiagrass, buffalograss, St. Augustinegrass and kikuyugrass including residential lawns (except California). Controls listed broadleaf, sedge and grass weeds — Weed Group A includes yellow nutsedge, green kyllinga and globe sedge; Group B (suppression only) includes purple nutsedge, dallisgrass, bahiagrass and torpedograss. USE LIMITS: max 6.26 oz/A/year, max 1.95 oz/A per application, no more than 3 applications per year at the highest rate, and at least 28 days between retreatments. Tank mix with fluazifop-P-butyl (Fusilade II) is labeled for St. Augustinegrass and zoysiagrass to control bermudagrass and goosegrass — Zoysia rate is Recognition 1.95 oz/A (0.045 oz per 1000 sqft) plus Fusilade II 16-24 oz/A (0.37-0.55 oz per 1000 sqft), with 0.25-0.5% v/v non-ionic surfactant. Label warns: do NOT use the Recognition + Fusilade II mix for crabgrass (herbicide antagonism), and do NOT apply Recognition + triclopyr to zoysiagrass (unacceptable injury may occur) — the triclopyr mix for doveweed is St. Augustine only. The label contains no safener language; marketing copy referencing a metcamifen safener is not label-supported."

  "Monument II":
    active_ingredients: ["trifloxysulfuron-sodium"]
    category: herbicide
    notes: "Syngenta; alternate brand name for Recognition (EPA Reg. 100-1658) — same 20.4% trifloxysulfuron-sodium formulation. See the Recognition entry for rates, use limits and tank-mix restrictions."

  "Halo 5WDG":
    active_ingredients: ["halosulfuron-methyl"]
    category: herbicide
    notes: "Albaugh 'Halo 5WDG Select'; EPA Reg. 89442-43. 5% halosulfuron-methyl WDG — a SedgeHammer generic. CONCENTRATION MATTERS: SedgeHammer's base EPA label (81880-1) is 75% halosulfuron; the 5% products (Halo 5WDG, SedgeHammer+) are pre-diluted with surfactant and dosed per pouch. Label rate is 0.5 oz / 13.5 g (one pouch) in 1 gal water per 1,000 sqft. ALS inhibitor (Group 2). Translocates to kill nutlets, so slower than a contact product but durable. Labeled for residential turf and established woody ornamentals in landscape beds."

  "Negate 37WG":
    active_ingredients: ["rimsulfuron", "metsulfuron-methyl"]
    category: herbicide
    notes: "Quali-Pro; 16.67% rimsulfuron + 20% metsulfuron-methyl. Both ALS inhibitors (Group 2) with synergistic activity. Labeled for established Bermuda and Zoysia only — it will damage most other turf. Targets Poa annua plus 35+ grasses and broadleaves; 1.5 oz/acre. Metsulfuron can discolour some zoysia cultivars; check tolerance for Zeon (Zoysia matrella) before broadcasting."

  "Broadloom Sedge Control":
    active_ingredients: ["bentazon"]
    category: herbicide
    notes: "Southern Ag; 44% bentazon, a Basagran generic. Group 6 (photosystem II inhibitor) — a genuinely different mode of action from the ALS sedge products, which makes it the useful rotation partner. CONTACT activity only: it burns foliage and does not translocate to nutlets, so yellow nutsedge regrows from tubers and repeat applications are expected. Labeled for turf and ornamentals; 0.75 oz per 1,000 sqft. Thorough leaf coverage is essential."

  "Hi-Yield 2,4-D":
    active_ingredients: ["2,4-D"]
    category: herbicide
    notes: "Voluntary Purchasing Group; 2,4-D dimethylamine salt. Group 4 (synthetic auxin). Broadleaf only — no activity on sedges or grasses. Zoysia tolerates 2,4-D at label rates but is more sensitive than bermudagrass; avoid during spring green-up and in high heat. Volatility and drift onto ornamentals are the main risks in a mixed landscape."

  "Triad QC":
    active_ingredients: ["2,4-D", "quinclorac", "dicamba"]
    category: herbicide
    notes: "Albaugh 'Triad QC Select'; EPA Reg. 89442-45. 13.29% 2,4-D + 9.79% quinclorac + 1.67% dicamba. NOTE this is a different formulation from plain 'Triad Select', which is 2,4-D + MCPA + dicamba — quinclorac is what adds crabgrass activity. Groups 4 + 4 + 26-ish; quinclorac is the crabgrass component and also hits some broadleaves. Check zoysia tolerance and rate before broadcasting; three-way products are the usual cause of ornamental damage from drift."

  "Spectracide Weed & Grass Killer":
    active_ingredients: ["diquat dibromide", "fluazifop-P-butyl", "dicamba"]
    category: herbicide
    notes: "Spectrum Brands consumer non-selective. NOT GLYPHOSATE — the manufacturer issued a statement specifically clarifying this, and it changes what the product can do. Diquat is a fast CONTACT burndown that does not translocate; fluazifop-P-butyl is the same graminicide as Fusilade II, which warm-season turf including zoysia tolerates. Consequence: on established zoysia this burns the top growth and the plant regrows from rhizomes and stolons. It is not a tool for removing zoysia from beds. Matt's field observation (2026-09-15) matches exactly: it 'only seems to stunt the zoysia for a little bit'. That is the chemistry behaving as labelled, not a weak batch. DO NOT USE IN LANDSCAPE BEDS AT THIS SITE, and do not tank-mix or closely sequence it with sethoxydim — see the Grass Getter entry for the antagonism, and note separately that the dicamba component is root-absorbed and mobile in soil, making it an oak-injury risk under pine straw and a damage risk to broadleaf shrubs (sweet viburnum, pineapple guava). Glyphosate, by contrast, binds to soil and cannot reach tree roots — so for tree safety this product is the more hazardous of the two, which inverts the usual consumer assumption."

  "Grass Getter":
    active_ingredients: ["sethoxydim"]
    category: herbicide
    notes: "Monterey Lawn & Garden; sethoxydim. ACCase inhibitor (Group 1) — selective SYSTEMIC graminicide for use in ornamental/landscape beds, NOT on turf. Rate per the manufacturer: 1 oz per gallon of water treats ~1,800 sqft, plus an oil concentrate at 1 oz per gallon (Monterey sells 'Herbicide Helper'; any crop oil concentrate at label rate is equivalent). ZOYSIA IS NOT A LABELLED TARGET — verified 2026-09-15 against four sethoxydim labels (BASF Segment II 7969-398; Hi-Yield Grass Killer and Ferti-lome Over-The-Top II, which share EPA Reg. 7969-58-7401; Monterey Grass Getter). All four carry an identical Grasses Controlled list and the string 'zoysia' appears zero times in any of them. Do not state or imply that sethoxydim controls zoysiagrass — no registrant makes that claim. What IS supportable: Clemson HGIC 'Weed Control in Landscapes: Herbicides' recommends sethoxydim and fluazifop for annual and perennial grass control among broadleaf landscape plants, and bermudagrass (comparably rhizomatous, and on-label) is described as suppressed by repeat applications rather than eradicated. Prefer sethoxydim over fluazifop for zoysia specifically: zoysia has real tolerance to fluazifop, which is why fluazifop is used INSIDE zoysia turf to suppress bermuda. TWO SITE CAUTIONS AT THIS PROPERTY: (1) the label's ornamental caution names 'Red Oak, White Oak and ornamental grass' as damage risks on foliar contact, and Wirestem Muhly (Muhlenbergia frondosa) is on the controlled list — so Matt's ornamental muhly and breeze grass are targets, not bystanders; keep applications away from them. (2) Tolerant Plants includes pineapple guava (Feijoa sellowiana) and multiple palms; sweet viburnum (Viburnum odoratissimum) is NOT listed, though the listed viburnums (japonicum, suspensum, dentatum) and the broadleaf-safe mode of action both point to tolerance. Does not control sedges. DO NOT TANK-MIX OR CLOSELY SEQUENCE with contact or growth-regulator herbicides: diquat destroys leaf tissue within hours and cuts off the translocation sethoxydim depends on, and dicamba/2,4-D are documented antagonists of ACCase inhibitors. This rules out mixing with Spectracide Weed & Grass Killer, which contains both."

  "Sethoxydim":
    active_ingredients: ["sethoxydim"]
    category: herbicide
    notes: "Active-ingredient name; sold as Grass Getter (Monterey), Segment II (BASF), Hi-Yield Grass Killer and Ferti-lome Over-The-Top II (both VPG, EPA Reg. 7969-58-7401). See the Grass Getter entry for rates, the zoysia label gap, and site cautions."

  "Glyphosate":
    active_ingredients: ["glyphosate"]
    category: herbicide
    notes: "Non-selective systemic (Group 9, EPSP synthase inhibitor). Sold as Roundup and many generics; a plain 41% concentrate is the cheap form. Clemson HGIC calls it the safest choice for spray application in existing flower and shrub beds so long as care is taken to prevent drift, and separately warns it will damage or kill desirable plants on contact. The distinction that matters at this site: glyphosate binds tightly to soil colloids and is not root-absorbed, so it CANNOT move through pine straw to oak or palm roots — unlike the soil-mobile dicamba in Spectracide. Its entire risk is foliar contact and drift, which is an application-method problem. For zoysia runners next to desirable plants, prefer a wick/wipe applicator over any spray: it contacts only what is physically wiped, giving zero drift within inches of sweet viburnum, pineapple guava, palms and ornamental muhly. Requires actively growing target; ineffective once zoysia approaches dormancy."

  # --- Pre-emergent herbicides ---
  "Prodiamine":
    active_ingredients: ["prodiamine"]
    category: herbicide
    notes: "Active-ingredient name; sold as Barricade. Long-residual spring/fall pre-emergent."

  "Dithiopyr":
    active_ingredients: ["dithiopyr"]
    category: herbicide
    notes: "Sold as Dimension. Provides crabgrass post-emergent control through tillering."

  # --- Fungicides ---
  "Heritage":
    active_ingredients: ["azoxystrobin"]
    category: fungicide
    notes: "Syngenta; broad-spectrum strobilurin for large patch and other warm-season diseases."

  "3336":
    active_ingredients: ["thiophanate-methyl"]
    category: fungicide
    notes: "Cleary's 3336; systemic fungicide for brown / large patch."

  # --- Fertilizers (slow-release / organic / synthetic) ---
  #
  # `active_ingredients` here lists the primary nutrients delivered (N, P, K,
  # iron, etc.) so the synthesizer recognizes the product as a fertilizer of
  # the right NPK family. The release type + burn-risk profile lives in
  # `notes` — this is the property that matters most for drought / stress
  # decisions, and it's the gap that caused the synthesizer to be overly
  # cautious about Milorganite during D3 drought (PR-comments 2026-06-09).
  "Milorganite":
    active_ingredients: ["nitrogen", "phosphorus", "iron"]
    category: fertilizer
    notes: "6-4-0 plus iron; slow-release biosolids from Milwaukee MMSD. Very low salt index — burn risk is minimal even on stressed / drought-affected turf. Reformulated from 5-3-0 around 2024; older references may list the previous NPK."

  "Sta-Green 16-0-10":
    active_ingredients: ["nitrogen", "potassium"]
    category: fertilizer
    notes: "16-0-10 slow-release synthetic (Lowe's brand). Slow N release keeps soluble salt concentration low, lower burn risk than fast-release urea but higher than organic biosolids. 20 lb bag covers ~4,000 sqft at the label rate."

  "Scotts Turf Builder":
    active_ingredients: ["nitrogen", "phosphorus", "potassium"]
    category: fertilizer
    notes: "Scotts consumer brand; NPK varies by SKU (commonly 32-0-4, 28-0-3). Typically partially slow-release urea + AS blends. Moderate burn risk on stressed turf — read the specific SKU label."

  "Ironite":
    active_ingredients: ["iron", "nitrogen"]
    category: fertilizer
    notes: "Iron supplement for green-up; mineral product (1-0-1 plus iron). Low N content means low burn risk. Often paired with a real fertilizer rather than used alone."
