default_language_version:
  # Any 3.12+ Python is fine; CI tests against the matrix in ci.yml.
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        # Resolve mypy via the project venv so the hook works whether or
        # not `uv` is on PATH. Devs using uv: `make dev` keeps things
        # consistent and the venv path is the canonical entry point.
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
