default_language_version:
  # Any 3.12+ Python is fine; CI tests against the matrix in ci.yml.
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # MUST stay in step with the `ruff` pin in pyproject.toml. When these
  # drift, the hook formats with one version and CI checks with another,
  # so pre-commit "fixing" a file is what breaks the build. That is not
  # hypothetical: this pin sat at v0.8.4 while the venv resolved 0.15.14,
  # and a hook-reformatted test file failed CI on all three Python
  # versions. Dependabot now watches this file too.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      # `ruff` is a legacy alias for `ruff-check` as of 0.15.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        # Resolve mypy via the project venv so the hook works whether or
        # not `uv` is on PATH. Devs using uv: `make dev` keeps things
        # consistent and the venv path is the canonical entry point.
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
