# SonarCloud configuration.
# Project URL: https://sonarcloud.io/project/overview?id=mattlawck_lawn-agents

sonar.projectKey=mattlawck_lawn-agents
sonar.organization=mattlawck

# Layout
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python — matches our CI matrix
sonar.python.version=3.12,3.13,3.14

# Coverage — produced by pytest via --cov-report=xml in pyproject.toml,
# uploaded as an artifact from the py3.12 CI job, downloaded by the
# Sonar job before scanning.
sonar.python.coverage.reportPaths=coverage.xml

# Don't scan generated / vendored / non-source paths.
sonar.exclusions=data/**,**/.venv/**,**/__pycache__/**,**/*.pyc,docs/journal/**
